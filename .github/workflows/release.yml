name: goreleaser

on:
  push:
    tags:
      - "v*"
  # Re-run a release for an existing tag (e.g. a stable tag on a commit that also carries a prerelease tag).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v11.0.99)"
        required: true
        type: string

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    env:
      # GoReleaser picks the tag with `git describe`, which is ambiguous when one commit carries several tags
      # (v11.0.99-beta.2 and v11.0.99 on the same commit); pin it to the tag that triggered the run.
      GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$GORELEASER_CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: $GORELEASER_CURRENT_TAG"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ env.GORELEASER_CURRENT_TAG }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          check-latest: false
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --parallelism 2 --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
